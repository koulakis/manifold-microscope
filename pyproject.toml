[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-microscope"
authors = [
    {name = "Marios Koulakis"}
]
description = "The data manifold under the microscope."
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "experiments_and_analysis/models/beta_vae/LICENSE",
    "docs/source/third_party/beta_vae.rst"
]
keywords = [
    "manifold learning",
    "differential geometry",
    "geometric deep learning",
    "datasets",
    "curvature"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "torch >= 2.2.0",
    "numpy >= 1.22.0",
    "tqdm",
    "opencv-python",
    "Pillow",
    "scipy",
    "geomloss",
    "joblib",
    "sympy",
    "scikit-learn",
    "seaborn",
    "einops >= 0.8.0",
]

[project.optional-dependencies]
docs = [
    "Sphinx == 8.1.3",
    "sphinx-rtd-theme == 3.0.2"
]
benchmark = [
    "torchvision",
    "typer",
    "pynndescent >= 0.5.13",
    "pytorch-lightning",
    "PyYAML",
    "matplotlib",
    "pandas"
]
dev = [
    "ruff == 0.17.3",
    "pyright[nodejs] == 1.1.414",
    "pre-commit == 4.6.2"
]

[project.urls]
Homepage = "https://github.com/koulakis/manifold-microscope"
Repository = "https://github.com/koulakis/manifold-microscope"
Issues = "https://github.com/koulakis/manifold-microscope/issues"

[tool.setuptools.packages.find]
include = ["microscope*", "experiments_and_analysis*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
experiments_and_analysis = ["scripts/configs/*.yaml", "scripts/configs/paper/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["microscope/**/*.py", "experiments_and_analysis/**/*.py", "tools/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "ANN", "D102", "D103", "D107", "D417"]
# Flexible values in scientific and configuration code may use Any.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test fixtures and regression tests do not need public API documentation/types.
"**/tests/**" = ["ANN", "D", "E501"]
# The solver configures warning filtering before importing training dependencies.
"experiments_and_analysis/models/beta_vae/solver.py" = ["E402"]
# Generated symbolic expressions are kept intact for comparison with their source.
"microscope/manifold_examples/ellipsoid.py" = ["E501"]
"microscope/manifold_examples/hyperboloid.py" = ["E501"]

[tool.pyright]
include = ["microscope", "experiments_and_analysis", "tools"]
exclude = ["**/tests", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.black]
line-length = 120

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
